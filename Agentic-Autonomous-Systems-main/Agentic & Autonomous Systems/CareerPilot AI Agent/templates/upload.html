{% extends 'base.html' %}

{% block title %}Upload Resume | CareerPilot AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card-modern p-4">
                <h1 class="h3 text-center">Upload your resume</h1>
                <p class="text-muted text-center">
                    Choose a PDF, DOC, or DOCX file (maximum {{ max_upload_mb|default(5) }} MB).
                </p>

                <form action="{{ url_for('upload') }}"
                      method="POST"
                      enctype="multipart/form-data">
                    <label class="form-label" for="resume">Resume file</label>
                    <input class="form-control mb-3"
                           id="resume"
                           type="file"
                           name="resume"
                           accept=".pdf,.doc,.docx"
                           required>
                    <button class="btn btn-gradient w-100" type="submit">
                        Upload Resume
                    </button>
                </form>

                <a class="d-block text-center mt-3"
                   href="{{ url_for('dashboard') }}">Back to Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
